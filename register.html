<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register – Top Movie Trailers</title>
  <style>
    body {
      background-color: #1a1a2e;
      color: white;
      font-family: Georgia, serif;
      margin: 0;
      padding: 0;
    }

    /* --- Navigation Bar --- */
    nav {
      background-color: #e94560;
      padding: 14px 0;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
      margin: 0 30px;
      letter-spacing: 1px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* --- Page Content --- */
    .page-content {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      color: #e94560;
      font-size: 30px;
      margin-bottom: 20px;
    }

    dl {
      font-size: 16px;
    }

    dt {
      font-weight: bold;
      margin-top: 18px;
      color: #e94560;
    }

    dd {
      margin: 6px 0 0 0;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 8px;
      font-size: 15px;
      border: 2px solid #e94560;
      background-color: #0f0f1a;
      color: white;
      box-sizing: border-box;
    }

    .radio-group label {
      margin-right: 20px;
      font-size: 15px;
    }

    input[type="submit"] {
      margin-top: 28px;
      background-color: #e94560;
      color: white;
      border: none;
      padding: 12px 40px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }

    input[type="submit"]:hover {
      background-color: #c73652;
    }
  </style>
</head>

<body bgcolor="#1a1a2e">

  <!-- Navigation Bar -->
  <nav>
    <a href="index.html">Home</a>
    <a href="register.html">Register</a>
    <a href="about.html">About</a>
  </nav>

  <div class="page-content">

    <h1>Create an Account</h1>

    <form action="http://localhost/echo.py" method="post">

      <dl>

        <dt>Name</dt>
        <dd><input type="text" name="name" placeholder="Enter your full name"></dd>

        <dt>Phone Number</dt>
        <dd><input type="tel" name="phone" placeholder="Enter your phone number"></dd>

        <dt>Email Address</dt>
        <dd><input type="email" name="email" placeholder="Enter your email address"></dd>

        <dt>Password</dt>
        <dd><input type="password" name="password" placeholder="Create a password"></dd>

        <dt>Would you like to receive email updates?</dt>
        <dd class="radio-group">
          <label><input type="radio" name="updates" value="yes"> Yes</label>
          <label><input type="radio" name="updates" value="no"> No</label>
        </dd>

      </dl>

      <input type="submit" value="Submit">

    </form>

  </div>

</body>
</html>
